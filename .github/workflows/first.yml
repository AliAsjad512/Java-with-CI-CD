name: Environment Variable Demo

on:
  workflow_dispatch:

env:
  APP_NAME: DevOps-Shack-App

jobs:

  demo:
    runs-on: ubuntu-latest

    steps:
      - name: Print Variable
        run: echo "Application is $APP_NAME"

  demo1:
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: development

    steps:
      - run: echo "Environment is $ENVIRONMENT"

  demo2:
    runs-on: ubuntu-latest

    steps:
      - name: Step variable
        env:
          VERSION: "1.0"
        run: echo "Version is $VERSION"
