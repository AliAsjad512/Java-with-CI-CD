name: Java Build

on:
 push:
  branches:
   - main
 pull_request:
  branches:
   - main
 workflow_dispatch:

jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - name: Checkout Repository
     uses: actions/checkout@v7
   - name: Setup Java
     uses: actions/setup-java@v6
     with:
      distribution: temurin
      java-version: '21'
      cache: maven
   - name: Check Java
     run: java --version
   - name: Compile
     run: mvn compile
   - name: Run Tests
     run: mvn test
   - name: Package
     run: mvn package
   - name: Upload Build Artifact
     uses: actions/upload-artifact@v7
     with:
      name: java-application
      path: target/*.jar 
